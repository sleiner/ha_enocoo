[project]
name = "ha_enocoo"
version = "0.8.0"
description = "Custom Home Assistant integration for enocoo"
authors = [{ name = "Simon Leiner", email = "simon@leiner.me" }]
requires-python = ">=3.14.2"
readme = "README.md"
license = { text = "MIT" }
dependencies = ["async-lru>=2.4.0", "oocone==0.7.0"]

[build-system]
requires = ["uv_build>=0.11.19,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "homeassistant==2026.11.0",
    "mypy>=2.4.1",
    "nox>=2026.10.20",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.mypy]
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
addopts = "--ignore=.nox --ignore=.venv"
filterwarnings = ["ignore:::homeassistant"]

[tool.uv.build-backend]
module-root = "custom_components"
